<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stránka nenalezena · Grafysta</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/odibee-sans-cz/OdibeeSansCZ-Regular.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Odibee Sans CZ"; src: url(/fonts/odibee-sans-cz/OdibeeSansCZ-Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  html, body { margin: 0; background: #0a0a0a; color: #f2f2f3; }
  body { min-height: 100svh; display: grid; place-items: center; font-family: "Odibee Sans CZ", "Odibee Sans", "Arial Narrow", Impact, sans-serif; overflow: hidden; }
  body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(60vmax 40vmax at 50% 55%, rgba(82,39,255,.28), transparent 70%); pointer-events: none; }
  .hp-logo { position: fixed; z-index: 30; left: max(24px, env(safe-area-inset-left, 0px)); top: max(20px, env(safe-area-inset-top, 0px)); color: #fff;
    font-size: 40px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; text-decoration: none; view-transition-name: logo; }
  @media (max-width: 760px) { .hp-logo { font-size: 34px; } }
  main { position: relative; text-align: center; padding: 24px; }
  .n::before { content: "404"; }
  .n { margin: 0; font-size: clamp(140px, 30vw, 360px); line-height: .8; letter-spacing: .02em; color: transparent; -webkit-text-stroke: 2px #B19EEF; text-shadow: 0 0 60px rgba(82,39,255,.55); animation: rise 1s cubic-bezier(.215,.61,.355,1) both; }
  h1 { margin: 22px 0 8px; font-weight: 400; font-size: clamp(34px, 5vw, 56px); line-height: .95; text-transform: uppercase; animation: rise 1s .12s cubic-bezier(.215,.61,.355,1) both; }
  p { margin: 0 auto 30px; max-width: 34ch; color: rgba(242,242,243,.72); font-size: 22px; line-height: 1.15; animation: rise 1s .2s cubic-bezier(.215,.61,.355,1) both; }
  nav { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; animation: rise 1s .28s cubic-bezier(.215,.61,.355,1) both; }
  nav a { color: #fff; text-decoration: none; font-size: 20px; text-transform: uppercase; letter-spacing: .04em; padding: 13px 24px 11px; border-radius: 999px;
    background: rgba(20,20,24,.45); border: 1px solid rgba(255,255,255,.16); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); transition: background .25s, border-color .25s; }
  nav a:first-child { background: rgba(82,39,255,.7); border-color: rgba(177,158,239,.6); }
  nav a:hover, nav a:focus-visible { border-color: #B19EEF; }
  nav a:focus-visible { outline: 2px solid #B19EEF; outline-offset: 3px; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
  @media (prefers-reduced-motion: reduce) { .n, h1, p, nav { animation: none; } }
</style>
</head>
<body>
<!--MENU-->
<a class="hp-logo" href="/" aria-label="Grafysta, na úvod">Grafysta</a>
<main>
  <div class="n" aria-hidden="true"></div>
  <h1>Tahle stránka tu není</h1>
  <p>Možná se přesunula, nebo je v adrese překlep. Zkuste jednu z těchto cest.</p>
  <nav aria-label="Kam dál"><a href="/prace/">Mé práce</a><a href="/">Úvod</a><a href="/o-mne/">O mně</a></nav>
</main>
</body>
</html>
