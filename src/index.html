<style>
  html, body { height: 100%; margin: 0; background: #0a0a0a; color: #fff; }
  body { font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; overflow: hidden; }

  /* layout 9 "Zásuvka": logo top left, glass drawer on the right (mobile: glass bottom sheet) */
  .hp-logo { position: fixed; z-index: 3; margin: 0; pointer-events: none;
    top: max(28px, env(safe-area-inset-top)); left: max(48px, env(safe-area-inset-left));

  #hp-root { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .hp-btns { position: relative; z-index: 1; display: grid; }
  .hp-btn { display: block; padding: 0; margin: 0; border: 0; background: none; color: #fff; text-decoration: none; cursor: pointer; border-radius: 999px; font: inherit; }
  .hp-btn:focus-visible { outline: 2px solid #B19EEF; outline-offset: 3px; }
  .hp-label { font: 400 28px/1 "BebasNeue-Regular", "Bebas Neue", Impact, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: #fff; padding-top: 3px; }

  /* flame panel (Shader Card) behind the glass buttons */
  .hp-panel { position: absolute; right: max(24px, env(safe-area-inset-right)); bottom: max(24px, env(safe-area-inset-bottom)); pointer-events: auto; }
  .hp-flame, .hp-flame.shader-card { position: absolute; inset: 0; }
  .shader-card { overflow: hidden; isolation: isolate; border: 0.8px solid #1f1f1f; box-shadow: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1); }
  .shader-card__flame { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  /* glass panel under the flame: the flame is see-through, so the refracted ribbon shows above it */
  .hp-panel-glass { position: absolute !important; inset: 0; }
  .shader-card--clear { border: 0; box-shadow: none; pointer-events: none; }

  /* mobile: floating flame card with a grip */
  .hp-sheet { position: absolute; pointer-events: auto; transition: transform .45s cubic-bezier(.22,1,.36,1); }
  .hp-sheet .hp-btns { position: absolute; inset: 0; align-content: start; }
  .hp-sheet .hp-label { font-size: 24px; }
  .hp-handle { position: absolute; left: 50%; top: 0; width: 96px; height: 26px; margin-left: -48px; padding: 0; border: 0; background: none; cursor: pointer; touch-action: none; z-index: 2; }
  .hp-handle span { display: block; width: 44px; height: 5px; margin: 10px auto 0; border-radius: 3px; background: rgba(255,255,255,.55); }
  .hp-sheet.is-collapsed, .ribbon-focus .hp-sheet { transform: translateY(calc(100% - 26px + 12px + env(safe-area-inset-bottom))); }

  /* intro start state (removed by intro.js; failsafe in <head>) */
  .intro .hp-logo { visibility: hidden; }
  .intro .hp-panel, .intro .hp-sheet { opacity: 0; }
  .hp-logo-line { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .04em; }
  .hp-logo .ch { display: inline-block; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* poster (first frame) follows the same lens shift as the live ribbon */
  [data-ribbon-poster] { transform: translate(-12vw, -7vh); }
  @media (max-width: 760px) { [data-ribbon-poster] { transform: translate(0, -13vh); } }

  @media (max-width: 760px) {
    .hp-logo { top: max(24px, env(safe-area-inset-top)); left: max(20px, env(safe-area-inset-left)); font-size: 34px; }
  }
  @media (prefers-reduced-motion: reduce) { .hp-sheet { transition: none; } }
