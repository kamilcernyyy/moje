<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratoř: video z částic | Grafysta</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Pracovní laboratoř: krátké video složené z částic ve 3D.">
<meta name="theme-color" content="#0a0a0a">
<link rel="preload" href="/fonts/odibee-sans-cz/OdibeeSansCZ-Regular.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Odibee Sans CZ"; src: url(/fonts/odibee-sans-cz/OdibeeSansCZ-Regular.woff2) format("woff2"); font-display: swap; }
  :root { color-scheme: dark; --fg: #f2f2f3; --mute: rgba(242,242,243,.66); --lilac: #B19EEF; --violet: #5227FF; --line: rgba(255,255,255,.18);
    --font: "Odibee Sans CZ", "Odibee Sans", "Arial Narrow", sans-serif; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a0a; color: var(--fg); font-family: var(--font); }
  #bg { position: fixed; inset: 0; z-index: 0; touch-action: none; cursor: crosshair; }
  #bg canvas { display: block; width: 100% !important; height: 100% !important; }
  .lv-src { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .lv-msg { position: fixed; inset: 0; z-index: 2; display: none; place-items: center; padding: 24px; text-align: center; font-size: 26px; letter-spacing: .05em; text-transform: uppercase; color: var(--mute); }
  .no-gl .lv-msg { display: grid; }

  /* panel (same as the other labs) */
  .lab-panel { position: fixed; z-index: 50; left: 16px; bottom: 16px; width: min(320px, calc(100vw - 32px)); max-height: calc(100svh - 120px); overflow: auto;
    padding: 14px 16px 16px; border-radius: 20px; background: rgba(14,14,18,.76); border: 1px solid var(--line); box-sizing: border-box;
    -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); font: 400 16px/1.1 var(--font); letter-spacing: .05em; text-transform: uppercase; }
  .panel-closed .lab-panel { display: none; }
  .lab-panel h2 { margin: 2px 0 6px; font-weight: 400; font-size: 22px; }
  .lab-panel p { margin: 0 0 12px; font-size: 14px; line-height: 1.15; color: var(--mute); }
  .lab-panel label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 0 0 9px; font-size: 15px; }
  .lab-panel input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--violet); }
  .lab-panel output { color: var(--lilac); }
  .lab-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
  .lab-row:last-child { margin-bottom: 0; }
  .lab-panel button[aria-pressed="true"] { background: var(--violet); border-color: var(--violet); }
  .lab-panel button, .lab-toggle { font: inherit; color: var(--fg); background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px 6px; cursor: pointer; }
  .lab-toggle { position: fixed; z-index: 51; left: 16px; bottom: 16px; display: none; font: 400 16px/1 var(--font); letter-spacing: .05em; text-transform: uppercase; background: rgba(14,14,18,.76); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); padding: 10px 14px 8px; }
  .panel-closed .lab-toggle { display: block; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--lilac); outline-offset: 2px; }
</style>
</head>
<body>
<script>if (matchMedia("(max-width: 760px)").matches) document.body.classList.add("panel-closed");</script>
<!--MENU-->
<h1 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Laboratoř: video z částic</h1>
<div id="bg" aria-hidden="true"></div>
<div class="lv-msg">Tenhle prohlížeč neumí WebGL 2, video z částic se tu nezobrazí.</div>
<video class="lv-src" muted loop playsinline autoplay preload="auto" crossorigin="anonymous" aria-hidden="true" tabindex="-1">
  <source src="/lab/video/zraloci.mp4" type="video/mp4">
  <source src="/lab/video/zraloci.webm" type="video/webm">
</video>

<aside class="lab-panel" aria-label="Nastavení videa z částic">
  <h2>Video z částic</h2>
  <p>Částice čtou video snímek po snímku. Žraloci vystoupí dopředu, střed víru se propadá do hloubky. Kurzorem (prstem) částice rozfoukáš.</p>
  <div class="lab-row"><button type="button" data-mode="castice">Částice</button><button type="button" data-mode="obe">Obojí</button><button type="button" data-mode="video">Video</button></div>
  <label>Velikost částic <output></output><input type="range" min=".4" max="2.5" step=".05" data-set="size"></label>
  <label>Hustota (míň = rychlejší) <output></output><input type="range" min=".5" max="1.6" step=".1" data-set="density"></label>
  <label>Žraloci vystoupí dopředu <output></output><input type="range" min="0" max="4" step=".1" data-set="depth"></label>
  <label>Propad víru do hloubky <output></output><input type="range" min="0" max="10" step=".25" data-set="funnel"></label>
  <label>Zářící obrysy <output></output><input type="range" min="0" max="2" step=".05" data-set="edge"></label>
  <label>Papír (pozadí kresby) <output></output><input type="range" min="0" max=".6" step=".02" data-set="paper"></label>
  <label>Chvění částic <output></output><input type="range" min="0" max=".2" step=".005" data-set="jitter"></label>
  <label>Rozfoukání kurzorem <output></output><input type="range" min="0" max="2.5" step=".05" data-set="blow"></label>
  <label>Náklon kamery (°) <output></output><input type="range" min="0" max="40" step="1" data-set="tilt"></label>
  <label>Přiblížení <output></output><input type="range" min=".6" max="2.2" step=".05" data-set="zoom"></label>
  <label>Rychlost videa <output></output><input type="range" min=".25" max="2" step=".05" data-set="speed"></label>
  <div class="lab-row"><button type="button" id="colors">Barvy webu</button><button type="button" id="wide">Kresba do stran</button><button type="button" id="orbit">Kamera sama krouží</button><button type="button" id="play">Pauza</button></div>
  <div class="lab-row"><button type="button" id="copy">Zkopírovat nastavení</button><button type="button" id="panel-toggle">Skrýt panel</button></div>
</aside>
<button type="button" class="lab-toggle">Panel</button>

<script src="/assets/vendor/gsap.min.js" defer></script>
<script src="/assets/js/lab-video.js" defer></script>
</body>
</html>
