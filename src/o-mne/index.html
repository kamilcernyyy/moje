<script>
  /* loader with the question: once per visit (session), skipped with reduced motion; failsafe shows the badge anyway */
  (function (d) {
    try {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches || sessionStorage.getItem('qseen')) return;
      sessionStorage.setItem('qseen', '1');
    } catch (e) {}
    d.documentElement.classList.add('qload');
    setTimeout(function () {
      d.documentElement.classList.remove('qload');
      if (!window.__qDone) { window.__qDone = 1; dispatchEvent(new Event('q-done')); }
    }, 7000);
  })(document);
</script>
