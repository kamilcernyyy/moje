<style>
  html, body { margin: 0; background: #0a0a0a; color: #fff; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  @font-face { font-family: "Odibee Sans CZ"; src: url(/fonts/odibee-sans-cz/OdibeeSansCZ-Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  body { font-family: "Odibee Sans CZ", "Odibee Sans", "Arial Narrow", Impact, sans-serif; }

  /* layout 9 "Zásuvka": logo top left, glass drawer on the right (mobile: glass bottom sheet) */
  .hp-logo { position: fixed; z-index: 3; margin: 0; pointer-events: none;
    top: max(28px, env(safe-area-inset-top)); left: max(48px, env(safe-area-inset-left));
    font: 400 40px/1 "Odibee Sans CZ", "Odibee Sans", "Arial Narrow", Impact, sans-serif; letter-spacing: .02em; text-transform: uppercase; color: #fff; }
  .intro .hp-logo { visibility: hidden; }
  .hp-logo-line { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .04em; }
  .hp-logo .ch { display: inline-block; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* flight through fog (GSAP ScrollTrigger, flight.js): the hero stays put (CSS sticky) while the scroll flies its
     camera into the fog; the wheel of works below comes up out of the same fog */
  html.fly { scroll-behavior: auto; }
  .fly .pr-track { height: 200svh; }
  .fly .pr-stage { position: sticky; top: 0; height: 100svh; overflow: hidden; }

  /* the wheel of works (Radial Scroll Gallery, Tailwind in /assets/js/tw.css) */
  .pr-gallery { position: relative; background: #0a0a0a; }
  .pr-gallery-head { position: relative; z-index: 2; display: grid; justify-items: center; gap: 10px; padding: 18vh 24px 0; text-align: center; text-transform: uppercase; }
  .pr-gallery-head p { margin: 0; font-size: 16px; letter-spacing: .32em; padding-left: .32em; color: rgba(242,242,243,.55); }
  .pr-gallery-head h2 { margin: 0; font-weight: 400; font-size: clamp(56px, 9vw, 120px); line-height: .9; letter-spacing: .01em; }
  .pr-gallery-head span { color: #B19EEF; }
  #pr-wheel { min-height: 100svh; }
  /* every work as a plain link too: crawlers, screen readers, no JS; shown as a list with reduced motion */
  .pr-list { list-style: none; margin: 0; padding: 0; }
  .pr-list a { color: #fff; text-decoration: none; }
  @media (prefers-reduced-motion: reduce) {
    .pr-list-wrap { position: static; width: auto; height: auto; margin: 0; overflow: visible; clip: auto; white-space: normal; padding: 0 24px 15vh; }
    .pr-list { display: grid; gap: 14px; max-width: 900px; margin: 0 auto; font-size: clamp(32px, 6vw, 64px); line-height: 1; text-transform: uppercase; }
    .pr-list span { display: block; font-size: 18px; letter-spacing: .06em; color: rgba(242,242,243,.6); }
    #pr-wheel { display: none; } /* the wheel only turns with motion: the plain list takes its place */
    .pr-gallery-head p { display: none; }
  }

  /* hero 03 (Originkit) on top — the original's Tailwind utilities written out, Grafysta colours and type */
  .pr-hero { position: relative; isolation: isolate; width: 100%; overflow: hidden; background: #0a0a0a; }
  .pr-hero-inner { position: relative; margin: 0 auto; display: flex; flex-direction: column; width: 100%; max-width: 1600px; height: 100svh; }
  @media (min-width: 1920px) { .pr-hero-inner { max-width: none; } }
  .pr-bg { position: absolute; inset: 0; overflow: hidden; }
  .pr-veil { pointer-events: none; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(10,10,10,.55) 0%, rgba(10,10,10,.22) 40%, transparent 64%); }
  .pr-center { pointer-events: none; position: relative; z-index: 20; display: flex; flex: 1; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px 48px; }
  .pr-content { pointer-events: none; position: relative; z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 34px; width: 100%; max-width: 378px; }
  .pr-content-veil { pointer-events: none; position: absolute; top: 50%; left: 50%; width: 360px; height: 300px; transform: translate(-50%, -50%); background: #0a0a0a; filter: blur(36px); }
  .pr-content-inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 34px; width: 100%; }
  .pr-text { display: flex; flex-direction: column; align-items: center; gap: 17px; width: 100%; }
  .pr-title { margin: 0; width: 100%; text-align: center; font-weight: 400; font-size: 72px; line-height: .92; letter-spacing: .01em; text-transform: uppercase; color: #fff; }
  .pr-lead { margin: 0; width: 100%; max-width: 340px; text-align: center; font-size: 22px; line-height: 1.15; letter-spacing: .04em; text-transform: uppercase; color: rgba(255,255,255,.62); text-wrap: pretty; }
  .pr-btns { pointer-events: auto; display: flex; flex-wrap: nowrap; align-items: center; justify-content: center; gap: 12px; }
  .pr-btn { display: block; width: 136px; height: 56px; border-radius: 999px; color: #fff; text-decoration: none; }
  .pr-btn--wide { width: 206px; }
  .pr-btn:focus-visible { outline: 2px solid #B19EEF; outline-offset: 3px; }
  .pr-btn-label { font-size: 21px; line-height: 1; letter-spacing: .04em; text-transform: uppercase; color: #fff; padding-top: 3px; white-space: nowrap; }
  @media (min-width: 768px) {
    .pr-veil { background: radial-gradient(ellipse at center, rgba(10,10,10,.62) 0%, rgba(10,10,10,.3) 38%, transparent 62%); }
    .pr-center { padding-left: 48px; padding-right: 48px; }
    .pr-content { max-width: 490px; gap: 44px; }
    .pr-content-veil { width: 591px; height: 497px; filter: blur(56px); }
    .pr-content-inner { gap: 44px; }
    .pr-text { gap: 22px; }
    .pr-title { font-size: 104px; }
    .pr-lead { max-width: 440px; font-size: 26px; }
    .pr-btns { gap: 16px; }
    .pr-btn { width: 180px; height: 64px; }
    .pr-btn--wide { width: 270px; }
    .pr-btn-label { font-size: 26px; }
  }
  @media (min-width: 1280px) {
    .pr-veil { background: radial-gradient(ellipse at center, rgba(10,10,10,.72) 0%, rgba(10,10,10,.38) 36%, transparent 60%); }
    .pr-center { padding: 24px 24px 80px; }
    .pr-content { max-width: 502px; gap: 32px; }
    .pr-content-veil { width: 433px; height: 364px; filter: blur(41px); }
    .pr-content-inner { gap: 32px; }
    .pr-text { gap: 16px; }
    .pr-title { font-size: 120px; }
  }
  /* hero copy reveal (hero-03: fade up out of a blur, 0.45 s ease-out-cubic) in CSS, so the headline paints without waiting for scripts */
  [data-reveal] { animation: pr-reveal .45s cubic-bezier(.215,.61,.355,1) both; }
  /* the headline is the page's largest paint: it comes into focus without starting fully transparent */
  .pr-title[data-reveal] { animation-name: pr-focus; animation-delay: .12s; }
  @keyframes pr-focus { from { opacity: .35; transform: translateY(14px); filter: blur(4px); } }
  .pr-lead[data-reveal] { animation-delay: .22s; }
  .pr-btns[data-reveal] { animation-delay: .32s; }
  @keyframes pr-reveal { from { opacity: 0; transform: translateY(14px); filter: blur(4px); } }
  @media (prefers-reduced-motion: reduce) { [data-reveal] { animation: none; } }


  @media (max-width: 760px) {
    .hp-logo { top: max(24px, env(safe-area-inset-top)); left: max(20px, env(safe-area-inset-left)); font-size: 34px; letter-spacing: .01em; }
  }
</style>
